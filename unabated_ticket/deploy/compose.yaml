# Unabated Ticket on the server (phone page plan step 4): the bets service
# (:8094, phone page + /bets.json + /settings.json + /edges.json proxy), the
# Edges runner (:8095) and the NFL fecta pricer (:8096), all on 127.0.0.1 only.
# network_mode: host keeps that loopback binding meaning the VM's own loopback;
# nothing is published and nothing listens on a public interface. The phone
# reaches :8094 and :8096 through `tailscale serve` on the host (deploy/README.md).
#
#   cd ~/NFLWork/unabated_ticket/deploy && docker compose up -d     (or ./deploy.sh)
#
# Code: the repo is mounted read-only at /app (the code resolves everything
# from the repo root), so an update is `git pull` + a restart, not a rebuild.
# Writes go only to ${UNABATED_DATA_DIR} (/data inside): bets.duckdb,
# novig_token.json (rewritten on every Auth0 rotation), logs/, nfl_specials.duckdb.
# Secrets are files on the host, never in an image: the Kalshi .pem
# (${KALSHI_PEM_PATH}, read-only) and unabated_ticket/bets_service/.env
# (gitignored, inside the read-only repo mount: KALSHI_API_KEY_ID, the
# POLYMARKET_US_* keys and the BFA / Wagerzon logins). BetOnline's rotating
# token file lives in ${UNABATED_DATA_DIR} (README step 10).

name: unabated-ticket

x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bets:
    build:
      context: ..
      dockerfile: deploy/bets_service.Dockerfile
    image: unabated-ticket-bets:local
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      BETS_DB_PATH: /data/bets.duckdb
      TAKER_DB_PATH: /data/taker.duckdb
      # The same Kalshi API on both services: the desk refuses an order the runner priced elsewhere (env_mismatch).
      KALSHI_BASE_URL: https://api.elections.kalshi.com/trade-api/v2
      # The bot trades only once this key file exists, locked to its own subaccount (key id and subaccount:
      # KALSHI_TAKER_API_KEY_ID + KALSHI_TAKER_SUBACCOUNT in bets_service/.env; deploy/README.md step 11).
      KALSHI_TAKER_PRIVATE_KEY_PATH: /data/kalshi_taker.pem
      # The Place button's own trade key; Place is on once KALSHI_PLACE_API_KEY_ID is set in bets_service/.env (deploy/README.md step 12).
      KALSHI_PLACE_PRIVATE_KEY_PATH: /data/kalshi_place.pem
      # touch to stop the bot, rm to resume (stops the Novig bot too).
      TAKER_STOP_PATH: /data/taker.stop
      # The Novig bot's trading key on its own subaccount, made on this VM by novig_subaccount_setup.py
      # keygen; it trades once NOVIG_TAKER_KEY_ID is set in bets_service/.env (deploy/README.md step 13).
      NOVIG_API_URL: https://api.novig.com
      NOVIG_TAKER_PRIVATE_KEY_PATH: /data/novig_bot.pem
      # The Novig bot's own stop switch, put in place by the setup; Kalshi's taker.stop stops it as well.
      NOVIG_TAKER_STOP_PATH: /data/novig_taker.stop
      # The Novig Place button's subaccount key: read and placing once NOVIG_PLACE_KEY_ID is set.
      NOVIG_PLACE_PRIVATE_KEY_PATH: /data/novig_place.pem
      BETS_SERVICE_LOG_PATH: /data/logs/bets_service.log
      BETS_SERVICE_LOG_CONSOLE: "1"
      NOVIG_TOKEN_PATH: /data/novig_token.json
      # Moved here from the Mac, never copied: its refresh token rotates (README step 10).
      BETS_BETONLINE_COOKIES_PATH: /data/recon_betonline_cookies.json
      KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi.pem
      BETS_EXTRA_ALLOWED_HOSTS: "${BETS_EXTRA_ALLOWED_HOSTS:?set BETS_EXTRA_ALLOWED_HOSTS in deploy/.env (the VM's MagicDNS name)}"
      UNABATED_RUNNER_URL: http://127.0.0.1:8095
    volumes:
      - ../..:/app:ro
      - "${UNABATED_DATA_DIR:?set UNABATED_DATA_DIR in deploy/.env}:/data"
      - "${KALSHI_PEM_PATH:?set KALSHI_PEM_PATH in deploy/.env}:/run/secrets/kalshi.pem:ro"
    logging: *rotated-logs

  runner:
    image: node:22-slim
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    working_dir: /app
    command: ["node", "unabated_ticket/server/runner.js"]
    environment:
      HOME: /tmp
      UNABATED_RUNNER_HOST: 127.0.0.1
      UNABATED_RUNNER_PORT: "8095"
      BETS_SERVICE_URL: http://127.0.0.1:8094
      KALSHI_BASE_URL: https://api.elections.kalshi.com/trade-api/v2
      # The same Novig on both services: the Novig desk refuses an order priced elsewhere (env_mismatch).
      NOVIG_API_URL: https://api.novig.com
    volumes:
      - ../..:/app:ro
    logging: *rotated-logs

  fectas:
    build:
      context: ../..
      dockerfile: unabated_ticket/deploy/nfl_specials.Dockerfile
    image: nfl-specials:local
    network_mode: host
    restart: unless-stopped
    init: true
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      NFL_SPECIALS_DB: /data/nfl_specials.duckdb
      NFL_SPECIALS_EXTRA_ALLOWED_HOSTS: "${BETS_EXTRA_ALLOWED_HOSTS:?set BETS_EXTRA_ALLOWED_HOSTS in deploy/.env (the VM's MagicDNS name)}"
      NFL_SPECIALS_DK_PROXY: "${NFL_SPECIALS_DK_PROXY:?set NFL_SPECIALS_DK_PROXY in deploy/.env (http://<Mac tailnet IP>:8097)}"
      NFL_SPECIALS_WAGERZON_ENV: /app/unabated_ticket/bets_service/.env
      WAGERZON_DEBUG_DIR: /data/logs
    volumes:
      - ../..:/app:ro
      - "${UNABATED_DATA_DIR:?set UNABATED_DATA_DIR in deploy/.env}:/data"
    logging: *rotated-logs
